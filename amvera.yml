meta:
  environment: node
  toolchain:
    name: npm
    version: 20  # Укажите мажорную версию Node.js, которую использует ваш проект (например, 18, 20, 22)

run:
  scriptName: src/index.js  # Путь к вашей главной точке входа

# Необязательные секции для тонкой настройки
build:
  additionalCommands: npm run build # Если у вас есть стадия сборки (например, для TypeScript)

resources:
  memory: 512Mi
  cpu: 0.5
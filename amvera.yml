meta:
  environment: node
  toolchain:
    name: npm
    version: 18 # Убедитесь, что версия совпадает с вашим проектом (18, 20 и т.д.)

run:
  scriptName: src/index.js # Главный файл вашего бота

# --- ВАРИАНТ 1: Если этап сборки не требуется, УДАЛИТЕ секцию build ---
# Просто оставьте файл без этой секции.

# --- ВАРИАНТ 2: Если нужно выполнить команды перед запуском (например, для TypeScript) ---
build:
  additionalCommands:
    - npm ci --only=production  # Эта команда уже выполняется платформой по умолчанию
    # - npm run compile        # Раскомментируйте, только если у вас есть такой скрипт в package.json

resources:
  memory: 512Mi
  cpu: 0.5